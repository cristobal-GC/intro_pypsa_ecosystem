[workspace]
name = "intro-pypsa-ecosystem"
description = "Jupyter notebooks introducing the PyPSA ecosystem (PyPSA, atlite, linopy, ...)"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
pypsa = ">=1.4"
highspy = "*"
jupyterlab = "*"

[tasks]
lab = "jupyter lab"
