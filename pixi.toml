[workspace]
name = "intro-pypsa-ecosystem"
description = "Jupyter notebooks introducing the PyPSA ecosystem (PyPSA, atlite, linopy, ...)"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
pypsa = ">=1.4"
highspy = "*"
jupyterlab = "*"
atlite = ">=0.6"
cartopy = ">=0.26.0,<0.27"

[tasks]
lab = "jupyter lab"

# Tools of visual_guide/ (editing the .odp): `pixi run -e visual-guide python ...`
[feature.visual-guide.dependencies]
lxml = "*"

[environments]
default = { solve-group = "default" }
visual-guide = { features = ["visual-guide"], solve-group = "default" }
