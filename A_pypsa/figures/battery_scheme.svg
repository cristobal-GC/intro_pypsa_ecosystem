<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="violet"/>
    </marker>
  </defs>

  <!-- Background (keeps the figure readable with dark notebook themes) -->
  <rect x="0" y="0" width="680" height="450" rx="10" fill="white"/>

  <!-- ===== South bus (AC) ===== -->
  <rect x="160" y="90" width="360" height="10" fill="grey"/>
  <text x="145" y="96" text-anchor="end" font-weight="bold">South</text>
  <text x="145" y="112" text-anchor="end" font-size="12" fill="#666">AC bus</text>

  <!-- Line to Center -->
  <line x1="310" y1="90" x2="310" y2="25" stroke="grey" stroke-width="2.5"/>
  <text x="325" y="45" font-weight="bold" font-size="13">South-Center</text>
  <text x="325" y="62" font-size="12" fill="#444">Line · to Center</text>

  <!-- Solar PV park -->
  <line x1="490" y1="90" x2="490" y2="70" stroke="grey" stroke-width="2"/>
  <circle cx="490" cy="50" r="20" fill="gold" stroke="#555" stroke-width="1.5"/>
  <text x="490" y="56" text-anchor="middle" font-size="18">~</text>
  <text x="520" y="47" font-weight="bold" font-size="13">Solar_South</text>
  <text x="520" y="64" font-size="12" fill="#444">Generator · solar</text>

  <!-- ===== Battery (dashed box) ===== -->
  <rect x="15" y="125" width="650" height="310" rx="12" fill="none" stroke="darkviolet" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="30" y="148" font-weight="bold" fill="darkviolet">Battery</text>

  <!-- Charger link: South -> South_battery -->
  <line x1="200" y1="102" x2="200" y2="298" stroke="violet" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="185" y="196" text-anchor="end" font-weight="bold" font-size="13">Battery_South_charger</text>
  <text x="185" y="213" text-anchor="end" font-size="12" fill="#444">Link · efficiency η = √0.96</text>

  <!-- Discharger link: South_battery -> South -->
  <line x1="440" y1="298" x2="440" y2="102" stroke="violet" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="455" y="196" font-weight="bold" font-size="13">Battery_South_discharger</text>
  <text x="455" y="213" font-size="12" fill="#444">Link · efficiency η = √0.96</text>

  <!-- Inverter annotation -->
  <text x="320" y="196" text-anchor="middle" font-size="12" fill="darkviolet">Inverter (MW): one device, two links</text>
  <text x="320" y="213" text-anchor="middle" font-size="12" fill="darkviolet">p_nom_charger = η · p_nom_discharger</text>

  <!-- South_battery bus (DC) -->
  <rect x="160" y="300" width="360" height="10" fill="darkviolet"/>
  <text x="145" y="306" text-anchor="end" font-weight="bold">South_battery</text>
  <text x="145" y="322" text-anchor="end" font-size="12" fill="#666">auxiliary DC bus</text>

  <!-- Store -->
  <line x1="320" y1="310" x2="320" y2="350" stroke="darkviolet" stroke-width="2"/>
  <rect x="265" y="350" width="110" height="60" rx="6" fill="white" stroke="darkviolet" stroke-width="2.5"/>
  <rect x="375" y="367" width="9" height="26" rx="2" fill="darkviolet"/>
  <rect x="275" y="360" width="25" height="40" rx="2" fill="darkviolet"/>
  <rect x="307" y="360" width="25" height="40" rx="2" fill="darkviolet"/>
  <rect x="339" y="360" width="25" height="40" rx="2" fill="darkviolet" opacity="0.3"/>
  <text x="400" y="368" font-weight="bold" font-size="13">Battery_South</text>
  <text x="400" y="385" font-size="12" fill="#444">Store · storage (MWh)</text>
  <text x="400" y="402" font-size="12" fill="#444">e_cyclic = True</text>
</svg>
