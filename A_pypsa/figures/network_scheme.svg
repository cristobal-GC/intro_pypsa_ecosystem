<svg xmlns="http://www.w3.org/2000/svg" width="620" height="500" viewBox="0 0 620 500" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">
  <defs>
    <marker id="arrow-load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>

  <!-- Background (keeps the figure readable with dark notebook themes) -->
  <rect x="0" y="0" width="620" height="500" rx="10" fill="white"/>

  <g transform="translate(-60,0)">

  <!-- ===== Lines ===== -->
  <!-- North-Center -->
  <line x1="250" y1="110" x2="330" y2="250" stroke="grey" stroke-width="2.5"/>
  <text x="268" y="172" text-anchor="end" font-weight="bold" font-size="13">North-Center</text>
  <text x="268" y="189" text-anchor="end" font-size="12" fill="#444">Line · 50 km</text>

  <!-- South-Center -->
  <line x1="250" y1="400" x2="330" y2="260" stroke="grey" stroke-width="2.5"/>
  <text x="268" y="322" text-anchor="end" font-weight="bold" font-size="13">South-Center</text>
  <text x="268" y="339" text-anchor="end" font-size="12" fill="#444">Line · 50 km</text>

  <!-- ===== North bus ===== -->
  <rect x="160" y="100" width="260" height="10" fill="grey"/>
  <text x="145" y="106" text-anchor="end" font-weight="bold">North</text>
  <text x="145" y="122" text-anchor="end" font-size="12" fill="#666">AC bus</text>

  <!-- Wind farm -->
  <line x1="370" y1="100" x2="370" y2="70" stroke="grey" stroke-width="2"/>
  <circle cx="370" cy="50" r="20" fill="steelblue" stroke="#555" stroke-width="1.5"/>
  <text x="370" y="56" text-anchor="middle" font-size="18">~</text>
  <text x="400" y="47" font-weight="bold" font-size="13">Wind_North</text>
  <text x="400" y="64" font-size="12" fill="#444">Generator · wind</text>

  <!-- ===== Center bus ===== -->
  <rect x="270" y="250" width="300" height="10" fill="grey"/>
  <text x="255" y="256" text-anchor="end" font-weight="bold">Center</text>
  <text x="255" y="272" text-anchor="end" font-size="12" fill="#666">AC bus</text>

  <!-- CCGT -->
  <line x1="520" y1="250" x2="520" y2="215" stroke="grey" stroke-width="2"/>
  <circle cx="520" cy="195" r="20" fill="indianred" stroke="#555" stroke-width="1.5"/>
  <text x="520" y="201" text-anchor="middle" font-size="18">~</text>
  <text x="550" y="192" font-weight="bold" font-size="13">CCGT_Center</text>
  <text x="550" y="209" font-size="12" fill="#444">Generator · gas</text>

  <!-- Demand -->
  <line x1="420" y1="260" x2="420" y2="305" stroke="black" stroke-width="2.5" marker-end="url(#arrow-load)"/>
  <text x="450" y="290" font-weight="bold" font-size="13">Demand_Center</text>
  <text x="450" y="307" font-size="12" fill="#444">Load</text>

  <!-- ===== South bus ===== -->
  <rect x="160" y="400" width="260" height="10" fill="grey"/>
  <text x="145" y="406" text-anchor="end" font-weight="bold">South</text>
  <text x="145" y="422" text-anchor="end" font-size="12" fill="#666">AC bus</text>

  <!-- Solar PV park -->
  <line x1="370" y1="410" x2="370" y2="440" stroke="grey" stroke-width="2"/>
  <circle cx="370" cy="460" r="20" fill="gold" stroke="#555" stroke-width="1.5"/>
  <text x="370" y="466" text-anchor="middle" font-size="18">~</text>
  <text x="400" y="457" font-weight="bold" font-size="13">Solar_South</text>
  <text x="400" y="474" font-size="12" fill="#444">Generator · solar</text>
  </g>
</svg>
